name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-and-quick-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check sona scripts
      - run: ruff format --check sona scripts
      - run: python scripts/selftest.py --quick
